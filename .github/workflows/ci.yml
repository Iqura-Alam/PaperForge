name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, 002-cloud-agentic-platform]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        run: npm run lint

      - name: Build check
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/
          if-no-files-found: ignore

  security:
    name: Security audit
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high

  docker:
    name: Docker build validation
    runs-on: ubuntu-latest
    needs: test
    # Only validate docker build on main/branch pushes, not PRs to save minutes
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t paperforge:ci .

      - name: Smoke test container health
        run: |
          docker run -d -p 4174:4174 --name pf-test paperforge:ci
          sleep 15
          curl -f http://localhost:4174/api/health || (docker logs pf-test && exit 1)
          docker stop pf-test
